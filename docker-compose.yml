version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: project_postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: projects_db
      POSTGRES_MULTIPLE_DATABASES: users_db,projects_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin"]
      interval: 10s
      timeout: 5s
      retries: 5

  user-service:
    build: ./user-service
    container_name: user_service
    environment:
      - DATABASE_URL=postgresql://admin:admin123@postgres:5432/users_db
      - SECRET_KEY=your-super-secret-key-change-in-production
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
    ports:
      - "8000:8000"
    volumes:
      - ./user-service:/app
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app_network
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  project-service:
    build: ./project-service
    container_name: project_service
    environment:
      - DATABASE_URL=postgresql://admin:admin123@postgres:5432/projects_db
      - USER_SERVICE_URL=http://user-service:8000
      - SECRET_KEY=your-super-secret-key-change-in-production
    ports:
      - "8001:8001"
    volumes:
      - ./project-service:/app
    depends_on:
      postgres:
        condition: service_healthy
      user-service:
        condition: service_started
    networks:
      - app_network
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload

  frontend:
    build: ./frontend
    container_name: frontend_app
    environment:
      - REACT_APP_USER_SERVICE_URL=http://localhost:8000
      - REACT_APP_PROJECT_SERVICE_URL=http://localhost:8001
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - user-service
      - project-service
    networks:
      - app_network
    stdin_open: true
    tty: true

volumes:
  postgres_data:

networks:
  app_network:
    driver: bridge